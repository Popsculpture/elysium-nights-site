<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Hybrid Loop Clipping Masks (Human smooth curve + Plant pointed leaf-arch) -->
    <clipPath id="clip-tail-left">
      <path d="M -570,-65 C -520,-95 -460,-52 -420,0 C -445,62 -530,96 -570,70 Z" />
    </clipPath>

    <clipPath id="clip-loop-1">
      <path d="M -420,0 C -380,52 -345,112 -280,112 C -215,112 -180,52 -140,0 C -165,-62 -230,-96 -280,-122 C -330,-96 -395,-62 -420,0 Z" />
    </clipPath>

    <clipPath id="clip-loop-2">
      <path d="M -140,0 C -100,-52 -65,-112 0,-112 C 65,-112 100,-52 140,0 C 115,62 50,96 0,122 C -50,96 -115,62 -140,0 Z" />
    </clipPath>

    <clipPath id="clip-loop-3">
      <path d="M 140,0 C 180,52 215,112 280,112 C 345,112 380,52 420,0 C 395,-62 330,-96 280,-122 C 230,-96 165,-62 140,0 Z" />
    </clipPath>

    <clipPath id="clip-tail-right">
      <path d="M 420,0 C 460,-52 520,-95 570,-65 L 570,70 C 530,96 445,62 420,0 Z" />
    </clipPath>

    <!-- Pinnate Leaf-Vein Rungs (Forward-branching herringbone vascular pairs) -->
    <g id="leaf-veins" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -60,-125 L -100,0 L -60,125" />
      <path d="M -20,-125 L -60,0 L -20,125" />
      <path d="M 20,-125 L -20,0 L 20,125" />
      <path d="M 60,-125 L 20,0 L 60,125" />
      <path d="M 100,-125 L 60,0 L 100,125" />
    </g>

    <!-- Chloroplast / Plastid Biconvex Pod -->
    <g id="plastid-pod">
      <path d="M -22,0 Q 0,-20 22,0 Q 0,20 -22,0 Z" fill="none" stroke="#FFD026" stroke-width="4" stroke-linejoin="round" />
      <path d="M -9,0 Q 0,-8 9,0 Q 0,8 -9,0 Z" fill="#8438FF" />
    </g>

    <!-- Crossover Hexagonal Node with Inner Seed-Lens Ring -->
    <g id="hex-hub">
      <polygon points="30,0 15,26 -15,26 -30,0 -15,-26 15,-26" fill="#8438FF" />
      <path d="M -17,0 Q 0,-18 17,0 Q 0,18 -17,0 Z" fill="none" stroke="#B78BFF" stroke-width="2.2" stroke-linejoin="round" />
    </g>
  </defs>

  <!-- Centered & Tilted at -28 deg to match the cover layout -->
  <g transform="translate(600, 400) rotate(-28)">

    <!-- 1. Clipped Pinnate Lateral Veins -->
    <g clip-path="url(#clip-tail-left)" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -525,-125 L -565,0 L -525,125" />
      <path d="M -485,-125 L -525,0 L -485,125" />
      <path d="M -445,-125 L -485,0 L -445,125" />
    </g>

    <g clip-path="url(#clip-loop-1)">
      <use href="#leaf-veins" x="-280" y="0" />
    </g>

    <g clip-path="url(#clip-loop-2)">
      <use href="#leaf-veins" x="0" y="0" />
    </g>

    <g clip-path="url(#clip-loop-3)">
      <use href="#leaf-veins" x="280" y="0" />
    </g>

    <g clip-path="url(#clip-tail-right)" fill="none" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 485,-125 L 445,0 L 485,125" />
      <path d="M 525,-125 L 485,0 L 525,125" />
      <path d="M 565,-125 L 525,0 L 565,125" />
    </g>

    <!-- 2. Central Vascular Phloem Midrib -->
    <line x1="-565" y1="0" x2="565" y2="0" stroke="#B78BFF" stroke-width="3.5" stroke-linecap="round" />

    <!-- 3. Hybrid Double Helix Strands -->
    <g fill="none" stroke="#FFD026" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <!-- Human Strand (Canonical smooth B-DNA curve) -->
      <path d="M -570,-65
               C -520,-95 -460,-52 -420,0
               C -380,52 -345,112 -280,112
               C -215,112 -180,52 -140,0
               C -100,-52 -65,-112 0,-112
               C 65,-112 100,-52 140,0
               C 180,52 215,112 280,112
               C 345,112 380,52 420,0
               C 460,-52 520,-95 570,-65" />

      <!-- Plant Strand (Pointed lanceolate leaf-arches) -->
      <path d="M -570,70
               C -530,96 -445,62 -420,0
               C -395,-62 -330,-96 -280,-122
               C -230,-96 -165,-62 -140,0
               C -115,62 -50,96 0,122
               C 50,96 115,62 140,0
               C 165,-62 230,-96 280,-122
               C 330,-96 395,-62 420,0
               C 445,62 530,96 570,70" />
    </g>

    <!-- 4. Docked Chloroplast / Plastid Pods on Alternating Botanical Crests -->
    <use href="#plastid-pod" x="-280" y="-139" />
    <use href="#plastid-pod" x="0" y="139" />
    <use href="#plastid-pod" x="280" y="-139" />

    <!-- 5. Four Symmetrical Crossover Hexagons -->
    <use href="#hex-hub" x="-420" y="0" />
    <use href="#hex-hub" x="-140" y="0" />
    <use href="#hex-hub" x="140" y="0" />
    <use href="#hex-hub" x="420" y="0" />

  </g>
</svg>