<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Elysium, under a broken halo</title>
  <desc id="description">An original geometric city illustration. Stacked teal towers, pink architectural fins, an elevated train, and a small amber-lit rooftop shelter sit beneath an enormous broken cyan halo. Angular Flow currents run through the city. The left side is quiet space for a website headline. Every element is an editable SVG shape.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="500" x2="1800" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#0b1115"/><stop offset=".42" stop-color="#0d1b23"/><stop offset="1" stop-color="#162730"/></linearGradient>
    <linearGradient id="halo" x1="1030" y1="140" x2="1550" y2="630" gradientUnits="userSpaceOnUse"><stop stop-color="#37e6e1"/><stop offset="1" stop-color="#248b93"/></linearGradient>
    <linearGradient id="groundFade" x1="900" y1="760" x2="900" y2="1000" gradientUnits="userSpaceOnUse"><stop stop-color="#0b1115" stop-opacity="0"/><stop offset="1" stop-color="#0b1115"/></linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#8cbdc5" opacity=".13"/></pattern>
    <pattern id="smallWindows" width="24" height="29" patternUnits="userSpaceOnUse"><path d="M4 5h8v13H4z" fill="#38717a"/><path d="M4 5h8v3H4z" fill="#65b6bb"/></pattern>
    <pattern id="darkWindows" width="23" height="29" patternUnits="userSpaceOnUse"><path d="M5 6h6v12H5z" fill="#2b515f"/></pattern>
    <pattern id="warmWindows" width="25" height="31" patternUnits="userSpaceOnUse"><path d="M5 5h8v13H5z" fill="#67534e"/><path d="M5 5h8v3H5z" fill="#d2a66e"/></pattern>
    <pattern id="hatching" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><path d="M0 0v10" stroke="#50a0aa" stroke-width="2" opacity=".18"/></pattern>
    <pattern id="magentaWindows" width="23" height="30" patternUnits="userSpaceOnUse"><path d="M4 6h7v11H4z" fill="#804057"/></pattern>
    <symbol id="vent" viewBox="0 0 40 22"><path d="M1 1h38v20H1z" fill="#10242d" stroke="#3a5e68"/><path d="M6 6h28M6 11h28M6 16h28" stroke="#3a5e68"/></symbol>
    <symbol id="person" viewBox="0 0 16 48"><circle cx="8" cy="6" r="5" fill="currentColor"/><path d="M3 14h10l3 19h-4v15H9V32H7v16H4V33H0z" fill="currentColor"/></symbol>
    <symbol id="windowRow" viewBox="0 0 150 18"><path d="M0 0h20v18H0zm32 0h20v18H32zm32 0h20v18H64zm32 0h20v18H96zm32 0h20v18H128z" fill="currentColor"/></symbol>
    <clipPath id="canvas"><path d="M0 0h1800v1000H0z"/></clipPath>
  </defs>
